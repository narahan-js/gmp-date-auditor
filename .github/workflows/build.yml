name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf rapidocr_onnxruntime pywebview pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "GMP_Date_Auditor" --add-data "index.html;." --collect-all rapidocr_onnxruntime main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMP_Date_Auditor_Windows
          path: dist/GMP_Date_Auditor.exe
